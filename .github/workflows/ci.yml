name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mts_test
          POSTGRES_USER: mts_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mts_test -d mts_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      MTS_DATABASE_URL: postgresql+asyncpg://mts_test:ci-disposable-only@localhost:5432/mts_test
      TEST_POSTGRES_URL: postgresql+asyncpg://mts_test:ci-disposable-only@localhost:5432/mts_test
      MTS_TRADING_MODE: paper
      MTS_LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy apps packages
      - name: PostgreSQL clean migration and rollback round trip
        run: |
          uv run --frozen alembic -c infra/migrations/alembic.ini upgrade head
          uv run --frozen alembic -c infra/migrations/alembic.ini check
          uv run --frozen alembic -c infra/migrations/alembic.ini downgrade base
          uv run --frozen alembic -c infra/migrations/alembic.ini upgrade head
      - run: uv run --frozen pytest -q
      - run: uv run --frozen bandit -q -r apps packages
      - run: uv run --frozen pip-audit --disable-pip --no-deps -r requirements.lock
      - run: uv build
      - name: Worker dependency check against real services
        run: MTS_REDIS_REQUIRED=true uv run --frozen python -m apps.worker.main --once
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., file: infra/docker/Dockerfile.api, push: false, load: true, tags: 'mts-ci:latest'}
      - name: Compose smoke test with least-privilege application user
        run: |
          python scripts/configure_local.py
          docker compose config --quiet
          docker compose up -d api worker
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 3
          done
          docker compose logs --no-color
          exit 1
      - name: Dependency and OS vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: mts-ci:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - if: always()
        run: docker compose down -v
